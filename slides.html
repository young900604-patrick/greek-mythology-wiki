case 'goals':return `<div class="content-grid">${[['看懂故事背景','認識特洛伊戰爭和返鄉的時間線'],['掌握主要角色','理解奧德修斯、家人與神明的關係'],['說出故事意義','從冒險找出機智、誘惑與歸鄉的主題']].map((a,i)=>`<article class="tile"><span class="mark">0${i+1}</span><h3>${a[0]}</h3><p>${a[1]}</p></article>`).join('')}</div>`;
case 'time':return `<div class="time-row"><div class="time-card"><div class="eyebrow">THE TROJAN WAR</div><strong>10 年</strong><p>特洛伊戰爭的傳說性時間；《伊利亞德》只描寫其中一段。</p></div><div class="time-plus">+</div><div class="time-card"><div class="eyebrow">THE RETURN VOYAGE</div><strong>10 年</strong><p>戰後返鄉歷程，最後回到伊薩卡。</p></div><div class="time-plus">=</div><div class="time-card"><div class="eyebrow">AWAY FROM HOME</div><strong>20 年</strong><p>奧德修斯遠離故鄉的總時間設定。</p></div></div>`;
case 'characters':return `<div class="content-grid">${[['奧德修斯','伊薩卡國王｜回家的英雄'],['佩涅洛佩','妻子｜等待與應對求婚者'],['帖勒馬科斯','兒子｜尋找父親消息'],['雅典娜','女神｜支持與協助'],['波賽頓','海神｜因兒子受傷而阻撓'],['波呂斐摩斯','獨眼巨人｜波賽頓之子']].map((a,i)=>`<article class="tile"><span class="tag">0${i+1} · CHARACTER</span><h3>${a[0]}</h3><p>${a[1]}</p></article>`).join('')}</div>`;
case 'structure':return `<div class="storyline">${[['01–04','家中的危機'],['05–08','走向費埃克斯人'],['09–12','回憶航海冒險'],['13–24','返鄉與重逢']].map(a=>`<article class="stop"><div class="large-label">BOOK ${a[0]}</div><h3>${a[1]}</h3><p>這是敘事段落，不一定是事件的先後順序。</p></article>`).join('')}</div>`;
case 'themes':return `<div class="content-grid">${[['01','智慧與傲慢','獨眼巨人：成功後的驕傲，也可能帶來代價'],['02','誘惑與控制','塞壬：在危險來臨之前，先做好自我限制'],['03','忠誠與歸鄉','佩涅洛佩：回家不只是航行，也是重新建立關係']].map(a=>`<article class="tile"><span class="tag">${a[0]} / THEME</span><h3>${a[1]}</h3><p>${a[2]}</p></article>`).join('')}</div>`;
case 'qa':return `<div class="qa-row"><div class="big-qa"><div class="eyebrow">百科整理 S06 · 疑義</div><h2>Leda ?</h2><p>某次級資料在第 11 卷摘要使用此名。</p></div><div class="mark" style="text-align:center">→</div><div class="big-qa"><div class="eyebrow">古典原典 S08 · 核查</div><h2>Anticleia ✓</h2><p>《奧德賽》第 11 卷所記載的母親姓名。</p></div></div>`;
case 'quiz':{let Q=[['奧德修斯離家約幾年？',['10年','20年','30年'],1,'戰爭約10年＋戰後返鄉約10年。'],['喀耳刻主要出現在哪一卷？',['第10卷','第12卷','第24卷'],0,'喀耳刻在第10卷，塞壬是第12卷。'],['奧德修斯如何聽塞壬歌聲？',['跳下海','用蠟塞耳','把自己綁在桅杆'],2,'船員塞耳，奧德修斯則被綁在桅杆。']];return `<div class="quizwrap">${Q.map((q,i)=>`<div class="quiz-card"><h3>Q${i+1}　${q[0]}</h3>${q[1].map((a,j)=>`<button class="answer" data-q="${i}" data-a="${j}" onclick="answer(${i},${j},${q[2]})">${a}</button>`).join('')}<div class="feedback" id="fb${i}"></div></div>`).join('')}</div>`}
case 'end':return `<div class="end-block"><div><div class="eyebrow">EPIC / NOSTOS / HOMECOMING</div><h2>Home is more<br>than a place.</h2><p>返鄉意味著勇氣、辨認與信任。請回到 LLM Wiki 查看每一段教學內容所依據的來源。</p><a class="gold-btn" href="index.html" style="display:inline-block">探索 Wiki ↗</a></div><div class="tile tiny-sources"><div class="eyebrow">本次主要參考來源</div><p>荷馬《奧德賽》、荷馬《伊利亞德》、赫西俄德《神譜》、OpenLearn、Theoi、World History Encyclopedia。</p><p>全部來源網址都可在 Wiki 中點選查證。</p></div></div>`;
default:return `<div class="bulletgrid">${p.map((txt,i)=>`<article class="tile"><span class="mark">0${i+1}</span><p>${e(txt)}</p></article>`).join('')}</div>`;}}
function answer(q,a,c){const buttons=[...document.querySelectorAll(`[data-q="${q}"]`)];buttons.forEach(b=>{b.disabled=true;b.classList.toggle('correct',Number(b.dataset.a)===c);b.classList.toggle('wrong',Number(b.dataset.a)===a&&a!==c)});let notes=['戰爭約10年＋戰後返鄉約10年。','喀耳刻在第10卷，塞壬在第12卷。','船員塞耳，奧德修斯綁在桅杆。'];document.getElementById('fb'+q).textContent=(a===c?'✓ 答對了！ ':'再檢查一次。 ')+notes[q]}
function draw(){let s=D.slides[idx],refs=s.sourceIds.map(id=>`<a target="_blank" rel="noopener" href="${e(M[id].url)}">${id}</a>`).join(' '),cover=s.kind==='cover';document.getElementById('slide').innerHTML=(cover?`<div class="slidebody" style="justify-content:center">${content(s)}</div>`:`<header class="slidehead"><span class="eyebrow">${e(s.label)}</span><h1>${e(s.title)}</h1><p class="desc">${e(s.desc)}</p></header><div class="slidebody">${content(s)}</div>`)+`<footer class="slidefoot"><span>資料來源：${refs} · <a href="index.html">返回 Wiki ↗</a></span><span>THE ODYSSEY · ${s.slide_no} / ${D.slides.length}</span></footer>`;document.getElementById('counter').textContent=`${idx+1} / ${D.slides.length}`;document.getElementById('progress').style.width=(100*(idx+1)/D.slides.length)+'%';document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===D.slides.length-1}
function next(){idx=Math.min(idx+1,D.slides.length-1);draw()}function prev(){idx=Math.max(idx-1,0);draw()}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.addEventListener('keydown',ev=>{if(['ArrowRight','PageDown',' '].includes(ev.key)&&!(ev.target instanceof HTMLButtonElement)){ev.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(ev.key)){ev.preventDefault();prev()}});document.getElementById('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();draw();
</script></body></html>
